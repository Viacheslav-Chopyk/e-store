services:
  postgres:
    image: postgres:17-alpine
    container_name: estore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-estore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estore}
      POSTGRES_DB: ${DB_NAME:-estore}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

<nz-header class="header-toolbar">
  <span class="logo">🛒 Electronics Store</span>
  <div class="actions">
    @if (authService.user(); as user) {
      <span class="user-name">
        <nz-icon nzType="user" nzTheme="outline"/>
        {{ user.name }}
      </span>
      <button nz-button nzType="text" nzShape="circle" class="header-button" title="Log out" (click)="logout()">
        <nz-icon nzType="logout" nzTheme="outline"/>
      </button>
    } @else {
      <button nz-button nzType="text" class="header-button login-button" [routerLink]="'/login'">
        <nz-icon nzType="user" nzTheme="outline"/>
        Log in
      </button>
    }

    <nz-badge [nzCount]="(cartItemCount$ | async) ?? 0">
      <button nz-button nzType="text" nzShape="circle" [routerLink]="'/cart'" class="header-button cart-button">
        <nz-icon nzType="shopping-cart" nzTheme="outline"/>
      </button>
    </nz-badge>
  </div>
</nz-header>

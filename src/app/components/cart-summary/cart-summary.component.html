<h1>Shopping Cart</h1>

<button nz-button class="back-button" [routerLink]="'/products'">
  <nz-icon nzType="arrow-left"/> Back to Products
</button>

<div class="cart-container">
  @for (item of items(); track item.product.id) {
    <div class="cart-item">
      <img class="product-image" [src]="item.product.images[0]" alt="{{ item.product.name }}">

      <div class="item-details">
        <p class="product-name">{{ item.product.name }}</p>
        <p class="product-price">$ {{ item.product.price }} (x{{ item.quantity }})</p>
        <button nz-button nzType="text" nzDanger (click)="removeItem(item.product.id)"><nz-icon nzType="delete"/> Remove</button>
      </div>
    </div>
  }
</div>

<h2 class="total-amount">Total: ${{ total() }}</h2>

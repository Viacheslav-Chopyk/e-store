<nz-card class="product-card" nzHoverable [nzCover]="cover" (click)="openProductModal()">
  <h3 class="product-title">{{ product().name }}</h3>
  <div class="product-content">
    <p>Price: ${{ product().price }}</p>
    <p>Rating: ⭐ {{ product().rating }}/5</p>
  </div>
</nz-card>

<ng-template #cover>
  <div class="image-slider">
    <img
      [src]="product().images[currentImageIndex()]"
      alt="{{ product().name }}"
      class="main-image"
    />
    <button nz-button nzShape="circle" class="nav-button left" (click)="prevImage($event)">
      <nz-icon nzType="left"/>
    </button>
    <button nz-button nzShape="circle" class="nav-button right" (click)="nextImage($event)">
      <nz-icon nzType="right"/>
    </button>

    @if (authService.isAdmin()) {
      <!-- stopPropagation: otherwise the click also reaches the card and opens the modal -->
      <button
        nz-button
        nzShape="circle"
        nzDanger
        class="delete-button"
        title="Delete"
        nz-popconfirm
        nzPopconfirmTitle="Delete this product?"
        nzOkText="Delete"
        nzOkDanger
        (click)="$event.stopPropagation()"
        (nzOnConfirm)="deleteItem()">
        <nz-icon nzType="delete"/>
      </button>
    }
  </div>
</ng-template>

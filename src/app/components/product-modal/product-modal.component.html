<div class="modal-content">
  <div class="image-slider">
    <img
      [src]="product.images[currentImageIndex()]"
      alt="{{ product.name }}"
      class="main-image"
      />

      <button nz-button nzShape="circle" class="nav-button left" (click)="prevImage($event)">
        <nz-icon nzType="left"/>
      </button>
      <button nz-button nzShape="circle" class="nav-button right" (click)="nextImage($event)">
        <nz-icon nzType="right"/>
      </button>

      <div class="thumbnails">
        @for (image of product.images; track image; let i = $index) {
          <img
            [src]="image"
            [class.active]="i === currentImageIndex()"
            (click)="goToImage(i)"
            alt="Thumbnail {{ i + 1 }}"
            />
        }
      </div>
    </div>

    <p>{{ product.description }}</p>
    <p>Price: ${{ product.price }}</p>
    <p>Rating: ⭐ {{ product.rating }}/5</p>
  </div>

  <div class="modal-footer" *nzModalFooter>
    <button nz-button nzType="primary" (click)="addToCart()">
      <nz-icon nzType="shopping-cart"/> Add to Cart
    </button>
    <button nz-button (click)="close()">Close</button>
  </div>

<div class="login-container">
  <div class="login-card">
    <nz-segmented
      nzBlock
      [nzOptions]="modeOptions"
      [ngModel]="mode()"
      (ngModelChange)="setMode($event)"/>

    @if (error()) {
      <nz-alert nzType="error" [nzMessage]="error()!" nzShowIcon/>
    }

    <form nz-form nzLayout="vertical" [formRoot]="form">
      @if (mode() === 'register') {
        <nz-form-item>
          <nz-form-label nzRequired>Name</nz-form-label>
          <nz-form-control [nzValidateStatus]="status(form.name)" nzErrorTip="At least 2 characters">
            <nz-input-wrapper>
              <nz-icon nzInputPrefix nzType="user"/>
              <input nz-input [formField]="form.name" placeholder="Name" autocomplete="name"/>
            </nz-input-wrapper>
          </nz-form-control>
        </nz-form-item>
      }

      <nz-form-item>
        <nz-form-label nzRequired>Email</nz-form-label>
        <nz-form-control [nzValidateStatus]="status(form.email)" nzErrorTip="Enter a valid email">
          <nz-input-wrapper>
            <nz-icon nzInputPrefix nzType="user"/>
            <input nz-input [formField]="form.email" type="email" placeholder="Email" autocomplete="email"/>
          </nz-input-wrapper>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Password</nz-form-label>
        <nz-form-control [nzValidateStatus]="status(form.password)" nzErrorTip="At least 6 characters">
          <nz-input-password>
            <nz-icon nzInputPrefix nzType="lock"/>
            <input
              nz-input
              [formField]="form.password"
              placeholder="Password"
              [autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"/>
          </nz-input-password>
        </nz-form-control>
      </nz-form-item>

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="form().submitting()">
        {{ mode() === 'login' ? 'Log in' : 'Create account' }}
      </button>
    </form>
  </div>
</div>

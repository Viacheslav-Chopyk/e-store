<div class="filter-search">
  <nz-input-wrapper>
    <nz-icon nzInputPrefix nzType="search"/>
    <input nz-input [(ngModel)]="searchText" (ngModelChange)="applyFilters()" placeholder="Search products"/>
  </nz-input-wrapper>

  <nz-select [(ngModel)]="selectedType" (ngModelChange)="applyFilters()">
    @for (type of types; track type) {
      <nz-option [nzValue]="type" [nzLabel]="type"/>
    }
  </nz-select>
</div>

<div class="price-ranges">
  @for (price of priceRanges; track price) {
    <label nz-checkbox [nzChecked]="selectedPriceRanges().includes(price)" (nzCheckedChange)="togglePriceRange(price)">
      Up to ${{ price }}
    </label>
  }
</div>

<div class="price-range-filter">
  <nz-input-number [(ngModel)]="minPrice" [nzMin]="0" nzPlaceHolder="Min Price"/>

  <nz-input-number [(ngModel)]="maxPrice" [nzMin]="0" nzPlaceHolder="Max Price"/>

  <button nz-button nzType="primary" (click)="applyFilters()">Apply Price Range</button>
</div>
